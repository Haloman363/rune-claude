name: Build installers

# PyInstaller cannot cross-compile, so each OS builds its own backend binary on
# a native runner and electron-builder wraps it there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # manual "test the build" button
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/build-backend.js'
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false     # one platform failing shouldn't hide the others
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build installers
        run: npm run dist:${{ matrix.platform }}
        env:
          # Skip electron-builder's attempt to sign/notarize without secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the backend binary
        shell: bash
        run: |
          exe=backend-dist/rune-claude-server
          [ "${{ matrix.platform }}" = "win" ] && exe=backend-dist/rune-claude-server.exe
          "$exe" &
          pid=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7432/api/config || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          gltf=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7432/assets/scene/scene.gltf || true)
          kill $pid 2>/dev/null || true
          echo "api/config=$code scene.gltf=$gltf"
          [ "$code" = "200" ] || { echo "backend did not answer"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rune-claude-${{ matrix.platform }}
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  release:
    # Tag pushes publish; manual runs just leave artifacts attached to the run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
